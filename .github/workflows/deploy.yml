# Workflow de CI/CD: valida los archivos y despliega a GitHub Pages
name: Validar y desplegar en GitHub Pages

# Se ejecuta en cada push a main y también se puede disparar manualmente
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permisos necesarios para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que se solapen dos despliegues al mismo tiempo
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Job 1: Validación de la aplicación
  # ------------------------------------------------------------------
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Verificar que existen los archivos principales
        run: |
          echo "Comprobando estructura del proyecto..."
          test -f index.html
          test -f style.css
          test -f script.js
          echo "OK: index.html, style.css y script.js están presentes."

      - name: Validar sintaxis básica de HTML
        run: |
          if ! grep -qi "<!DOCTYPE html>" index.html; then
            echo "ERROR: index.html no declara <!DOCTYPE html>"
            exit 1
          fi
          echo "OK: index.html tiene un DOCTYPE válido."

      - name: Validar sintaxis de JavaScript
        run: |
          node --check script.js
          echo "OK: script.js no tiene errores de sintaxis."

  # ------------------------------------------------------------------
  # Job 2: Despliegue a GitHub Pages (solo si la validación fue exitosa)
  # ------------------------------------------------------------------
  desplegar:
    needs: validar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
